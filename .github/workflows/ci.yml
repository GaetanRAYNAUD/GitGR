# Tous les tests, sur main et sur chaque pull request.
#
# - interface : typage, tests unitaires (Vitest), E2E sur le backend simulé (Playwright) ;
# - rust : tests du backend sur de vrais dépôts git, sous Linux et sous Windows ;
# - app : E2E sur l'app compilée (Rust + WebView2 piloté par CDP) — Windows uniquement.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une PR annule la série précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  interface:
    name: Interface (typage, unitaires, E2E simulés)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Navigateur de Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-interface
          path: test-results/
          retention-days: 7

  rust:
    name: Backend Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  app:
    name: App compilée (Windows, WebView2)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Compile le binaire de debug, puis lance l'app pour chaque test (cf. e2e-app/app.ts).
      - run: npm run test:app
      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-app
          path: test-results/
          retention-days: 7
