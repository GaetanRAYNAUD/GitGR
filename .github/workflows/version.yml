# Nouvelle version de GitGR : onglet Actions → « Nouvelle version » → Run workflow, en
# choisissant le niveau (ou `gh workflow run version.yml -f niveau=patch`).
#
# - patch / minor / major : monte la version dans package.json, package-lock.json,
#   src-tauri/Cargo.toml et Cargo.lock ; `current` garde la version actuelle (première release).
# - CHANGELOG.md : la section « Non publié » devient celle de la version, datée. Vide, elle est
#   remplie avec les titres des PR fusionnées depuis le tag précédent.
# - Commit « Version x.y.z » et tag annoté vx.y.z, poussés ensemble sur main.
#
# Le push passe par la clé de déploiement `RELEASE_DEPLOY_KEY` (droit d'écriture, en exception
# du ruleset de main) : un push fait avec GITHUB_TOKEN serait refusé par le ruleset et ne
# lancerait pas le workflow suivant. Le tag lance « Release » (release.yml) : paquets signés et
# release GitHub en brouillon, publiée à la main.

name: Nouvelle version

on:
  workflow_dispatch:
    inputs:
      niveau:
        description: "Niveau de la nouvelle version (current : version actuelle, sans montée)"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, current]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Montée de version et tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: PR fusionnées depuis le tag précédent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$last" ]; then since=$(git log -1 --format=%cI "$last"); else since=1970-01-01T00:00:00Z; fi
          echo "Tag précédent : ${last:-aucun} ($since)"
          gh pr list --state merged --base main --limit 200 --search "merged:>$since" --json number,title,url > "$RUNNER_TEMP/prs.json"
      - name: Nouvelle version
        id: bump
        run: node scripts/release.mjs bump "${{ inputs.niveau }}" --prs "$RUNNER_TEMP/prs.json"
      - name: Commit, tag et push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "Version $VERSION"
          git tag -a "v$VERSION" -m "GitGR $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "### GitGR $VERSION : tag v$VERSION poussé, release en préparation" >> "$GITHUB_STEP_SUMMARY"
