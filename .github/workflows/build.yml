# Paquets de GitGR à la demande, pour essayer une branche (les releases passent par
# release.yml, avec les signatures de l'updater) :
# - Linux (AppImage, .deb, .rpm), artefact `gitgr-linux`. Compilé sur Ubuntu 22.04 : la glibc
#   la plus ancienne qu'on vise, pour que l'AppImage tourne aussi sur des distributions moins
#   récentes.
# - Windows (installateur NSIS `.exe`), artefact `gitgr-windows`. Tauri télécharge lui-même
#   NSIS. Pas de MSI : il crée toujours un raccourci sur le bureau.
# - macOS (image disque `.dmg`, binaire universel Intel + Apple Silicon), artefact
#   `gitgr-macos`. Signature ad hoc seulement (pas de certificat Apple) : à la première
#   ouverture, macOS bloque l'app (« endommagée » ou « développeur non identifié ») ; la
#   débloquer avec `xattr -cr /Applications/GitGR.app`, ou clic droit → Ouvrir.
#
# Lancer : onglet Actions → « Build » → Run workflow. Les paquets sont joints au run.
# Binaires non signés, sans les signatures de l'updater.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (AppImage, deb, rpm)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `tauri build` lance aussi `npm run build` (interface) avant de compiler le Rust.
      - run: npx tauri build --bundles appimage,deb,rpm
      - uses: actions/upload-artifact@v6
        with:
          name: gitgr-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `tauri build` lance aussi `npm run build` (interface) avant de compiler le Rust.
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: gitgr-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS (dmg, universel)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # Signature ad hoc : sans aucune signature, un binaire ne se lance pas sur Apple Silicon.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `tauri build` lance aussi `npm run build` (interface) avant de compiler le Rust.
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v6
        with:
          name: gitgr-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
