# Release de GitGR, sur chaque tag `v*` (poussé par « Nouvelle version », version.yml, ou à la
# main) :
# - paquets des trois plateformes, ceux qui se mettent à jour seuls signés avec la clé de
#   l'updater (secrets TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD) :
#   Windows (installateur NSIS), Linux (AppImage signée ; deb et rpm), macOS (dmg, et
#   l'archive .app.tar.gz de l'updater ; signature Apple ad hoc seulement) ;
# - manifeste `latest.json` de l'updater (scripts/release.mjs manifest) ;
# - release GitHub en **brouillon**, notes tirées de CHANGELOG.md, à publier à la main. Tant
#   qu'elle n'est pas publiée, les apps installées ne la voient pas (`releases/latest`).
#
# Relancer un job échoué remplace les fichiers déjà joints au brouillon.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Version du tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($version)"
            exit 1
          fi
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "::error::src-tauri/Cargo.toml n'est pas en $version"; exit 1; }
          node scripts/release.mjs notes "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (AppImage, deb, rpm)
    needs: check
    # Ubuntu 22.04 : la glibc la plus ancienne qu'on vise (cf. build.yml).
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Clé de l'updater donnée à cette étape seulement (pas à `npm ci` ni aux actions).
      - run: npx tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Paquets
        run: |
          mkdir out
          bundle=src-tauri/target/release/bundle
          cp "$bundle"/appimage/*.AppImage "$bundle"/appimage/*.AppImage.sig "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm out/
          ls -l out
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (NSIS)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (dmg, universel)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # Signature ad hoc : sans aucune signature, un binaire ne se lance pas sur Apple Silicon.
      APPLE_SIGNING_IDENTITY: "-"
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `app` : l'archive .app.tar.gz (et sa signature) de l'updater.
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Paquets
        run: |
          mkdir out
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$bundle"/dmg/*.dmg out/
          # Nom unique dans la release (« GitGR.app.tar.gz » ne dit ni la version ni l'architecture).
          cp "$bundle/macos/GitGR.app.tar.gz" "out/GitGR_${VERSION}_universal.app.tar.gz"
          cp "$bundle/macos/GitGR.app.tar.gz.sig" "out/GitGR_${VERSION}_universal.app.tar.gz.sig"
          ls -l out
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release GitHub (brouillon)
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Manifeste de l'updater et notes
        run: |
          node scripts/release.mjs manifest "$VERSION" dist "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" > "$RUNNER_TEMP/latest.json"
          mv "$RUNNER_TEMP/latest.json" dist/latest.json
          cat dist/latest.json
          node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat .github/release-install.md >> "$RUNNER_TEMP/notes.md"
          sed -i "s/{{version}}/$VERSION/g" "$RUNNER_TEMP/notes.md"
          ls -l dist
      - name: Release en brouillon
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --draft --verify-tag --title "GitGR $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "### GitGR $VERSION : release en brouillon, à publier depuis la page Releases" >> "$GITHUB_STEP_SUMMARY"
