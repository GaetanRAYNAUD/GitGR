[package]
name = "gitgr"
version = "0.1.2"
description = "GitGR — client Git de bureau visuel, multi-profils et multi-dépôts"
authors = ["GitGR contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "gitgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
# API des providers (GitHub, GitLab) : client HTTP bloquant, certificats du système.
ureq = { version = "3", features = ["platform-verifier"] }
# Avatars mis en cache en data URL.
base64 = "0.21"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Phrases de passe des clés SSH : trousseau de l'OS (Gestionnaire d'identification Windows,
# Secret Service sous Linux, trousseau macOS).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
